name: Deploy

# NOTA DE ESCOPO (Fase 0, Task 17): este workflow faz exatamente o que o
# plano pede — SSH na VPS, git pull, `docker compose pull` + `up -d --build`.
# Hoje, porém, isso é efetivamente um no-op sobre a aplicação: não existe
# nenhum Dockerfile no repo (nem na raiz, nem em apps/api/), e
# infra/docker-compose.yml só define imagens pré-construídas de infra
# (postgres/redis/cerbos/minio) — nenhum serviço com `build:` para a API
# em si. `--build` não vai falhar, mas também não constrói/roda a API
# NestJS; ele só recria a infra que já está de pé. A API ainda não tem
# rotas HTTP reais (confirmado na Task 16), então não há superfície de
# aplicação para deployar ainda. Escrever um Dockerfile de produção fica
# para quando a aplicação tiver essa superfície real (provavelmente
# Fase 1) — não é escopo desta task.
#
# Além disso, os secrets VPS_HOST e VPS_SSH_KEY referenciados abaixo ainda
# não estão cadastrados no repositório GitHub. Até que o Henrique os
# cadastre (ação de acesso a segredo, feita por ele na interface do
# GitHub), o job `deploy` abaixo vai falhar no step de SSH — comportamento
# esperado nesta fase, não um bug.
#
# GATE NO CI (revisão adversarial da Task 17): este workflow é disparado
# por `workflow_run` do workflow `CI`, não por `push` direto. Isso garante
# que o deploy só roda depois que o job `test` do ci.yml terminou — e o
# `if` abaixo garante que só roda se o CI tiver passado (`conclusion ==
# 'success'`), na branch main. Antes disso, `deploy.yml` disparava em
# paralelo com `ci.yml` no mesmo evento `push`, então o deploy podia
# terminar (e, uma vez os secrets cadastrados, executar SSH root na VPS)
# antes mesmo do CI terminar de rodar lint/test — inclusive em pushes com
# suíte vermelha. `needs: []` não corrigia isso: workflows separados não
# podem referenciar jobs de outros arquivos de workflow via `needs`.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy via SSH
        uses: appleboy/ssh-action@25ce8cbbcb08177468c7ff7ec5cbfa236f9341e1 # v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /docker/tinocerto
            git pull origin main
            docker compose pull
            docker compose up -d --build
            docker compose ps
