name: Deploy

# NOTA DE ESCOPO (Fase 0, Task 17): este workflow faz exatamente o que o
# plano pede — SSH na VPS, git pull, `docker compose pull` + `up -d --build`.
# Hoje, porém, isso é efetivamente um no-op sobre a aplicação: não existe
# nenhum Dockerfile no repo (nem na raiz, nem em apps/api/), e
# infra/docker-compose.yml só define imagens pré-construídas de infra
# (postgres/redis/cerbos/minio) — nenhum serviço com `build:` para a API
# em si. `--build` não vai falhar, mas também não constrói/roda a API
# NestJS; ele só recria a infra que já está de pé. A API ainda não tem
# rotas HTTP reais (confirmado na Task 16), então não há superfície de
# aplicação para deployar ainda. Escrever um Dockerfile de produção fica
# para quando a aplicação tiver essa superfície real (provavelmente
# Fase 1) — não é escopo desta task.
#
# Além disso, os secrets VPS_HOST e VPS_SSH_KEY referenciados abaixo ainda
# não estão cadastrados no repositório GitHub. Até que o Henrique os
# cadastre (ação de acesso a segredo, feita por ele na interface do
# GitHub), o job `deploy` abaixo vai falhar no step de SSH — comportamento
# esperado nesta fase, não um bug.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /docker/tinocerto
            git pull origin main
            docker compose pull
            docker compose up -d --build
            docker compose ps
