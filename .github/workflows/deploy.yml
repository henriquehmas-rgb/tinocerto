name: Deploy

# NOTA DE ESCOPO (Fase 0, Task 17): este workflow faz exatamente o que o
# plano pede — SSH na VPS, git pull, `docker compose pull` + `up -d --build`.
# ATUALIZAÇÃO (revisão de segurança pré-lançamento, achado M4): a nota
# original dizia que não existia nenhum Dockerfile no repo — isso está
# desatualizado. Hoje já existem `apps/api/Dockerfile` e
# `apps/web/Dockerfile`, então `--build` de fato constrói e roda a
# aplicação; não é mais um no-op sobre a API/web.
#
# Além disso, os secrets VPS_HOST e VPS_SSH_KEY referenciados abaixo ainda
# não estão cadastrados no repositório GitHub. Até que o Henrique os
# cadastre (ação de acesso a segredo, feita por ele na interface do
# GitHub), o job `deploy` abaixo vai falhar no step de SSH — comportamento
# esperado nesta fase, não um bug.
#
# GATE NO CI (revisão adversarial da Task 17): este workflow é disparado
# por `workflow_run` do workflow `CI`, não por `push` direto. Isso garante
# que o deploy só roda depois que o job `test` do ci.yml terminou — e o
# `if` abaixo garante que só roda se o CI tiver passado (`conclusion ==
# 'success'`), na branch main. Antes disso, `deploy.yml` disparava em
# paralelo com `ci.yml` no mesmo evento `push`, então o deploy podia
# terminar (e, uma vez os secrets cadastrados, executar SSH root na VPS)
# antes mesmo do CI terminar de rodar lint/test — inclusive em pushes com
# suíte vermelha. `needs: []` não corrigia isso: workflows separados não
# podem referenciar jobs de outros arquivos de workflow via `needs`.
#
# GATE ANTI-"PWN REQUEST" (revisão de segurança pré-lançamento, achado
# CRITICAL): `on: pull_request` no ci.yml (sem filtro de branch) roda em
# repositório público para PRs de QUALQUER fork. O filtro `branches: [main]`
# abaixo casa com o `head_branch` do evento que disparou o CI — que é a
# branch de origem no repositório de origem do evento, não necessariamente
# a branch `main` do repositório base. Um atacante pode forkar o repo,
# criar uma branch chamada `main` no fork, abrir um PR, deixar o CI passar
# e assim satisfazer esse filtro `branches: [main]` sem nunca ter enviado
# push para o `main` real. Sem checagem adicional, o job `deploy` abaixo
# rodaria com acesso aos secrets `VPS_HOST`/`VPS_SSH_KEY` do repositório
# BASE, fazendo SSH como root na VPS de produção a partir de um PR de
# fork. O `if:` do job `deploy` abaixo garante explicitamente que o evento
# que disparou o CI foi um `push` real (não um `pull_request`) E que veio
# do próprio repositório (não de um fork), fechando essa rota de ataque.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy via SSH
        uses: appleboy/ssh-action@25ce8cbbcb08177468c7ff7ec5cbfa236f9341e1 # v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          # script_stop (achado Important da verificação adversarial dos
          # fixes finais da Fase 0): appleboy/ssh-action usa `false` por
          # padrão -- comandos do script NÃO abortam em erro. Sem isso, se
          # `cd /docker/tinocerto` ou `git pull origin main` falhar (ex.:
          # working tree suja por outro processo), o script continua
          # adiante mesmo assim e pode terminar "verde" sem ter de fato
          # atualizado/reiniciado nada corretamente.
          script_stop: true
          script: |
            cd /docker/tinocerto
            git pull origin main
            # docker-compose.yml mora em infra/, não na raiz do repo (a
            # raiz é onde o `git pull` acima precisa rodar) — achado
            # IMPORTANT da revisão final consolidada: sem
            # `-f infra/docker-compose.yml`, `docker compose` na raiz falha
            # com "no configuration file provided: not found" (confirmado
            # ao vivo). Cada chamada de `docker compose` abaixo aponta
            # explicitamente para o compose file em infra/ em vez de mudar
            # de diretório no meio do script (o que exigiria mover o
            # `git pull` para depois do cd, misturando os dois contextos).
            docker compose -f infra/docker-compose.yml pull
            docker compose -f infra/docker-compose.yml up -d --build
            docker compose -f infra/docker-compose.yml ps
