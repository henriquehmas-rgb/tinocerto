name: tinocerto

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tinocerto
      POSTGRES_PASSWORD: dev_local_only
      POSTGRES_DB: tinocerto
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinocerto"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.44.0
    ports: ["127.0.0.1:3592:3592", "127.0.0.1:3593:3593"]
    volumes:
      - ".:/etc/cerbos:ro"
      - "../cerbos/policies:/policies"
    command: ["server", "--config=/etc/cerbos/cerbos.yaml"]

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    environment:
      MINIO_ROOT_USER: tinocerto
      MINIO_ROOT_PASSWORD: dev_local_only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    command: ["server", "/data", "--console-address", ":9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
