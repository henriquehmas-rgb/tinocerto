name: tinocerto-prod

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tinocerto_prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tinocerto
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["pgdata_prod:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinocerto_prod"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    restart: unless-stopped

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.44.0
    ports: ["127.0.0.1:3594:3592", "127.0.0.1:3595:3593"]
    volumes:
      - "./cerbos.prod.yaml:/etc/cerbos/cerbos.yaml:ro"
      - "../cerbos/policies:/policies:ro"
    command: ["server", "--config=/etc/cerbos/cerbos.yaml"]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    environment:
      MINIO_ROOT_USER: tinocerto_prod
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:9002:9000", "127.0.0.1:9003:9001"]
    command: ["server", "/data", "--console-address", ":9001"]
    volumes: ["miniodata_prod:/data"]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: tinocerto-api:prod
    env_file: ../apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      cerbos:
        condition: service_started
    ports: ["127.0.0.1:3100:3000"]
    networks:
      - default
      - traefik
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: tinocerto-web:prod
    environment:
      API_URL: http://api:3000
    depends_on:
      - api
    ports: ["127.0.0.1:3101:3000"]
    networks:
      - default
      - traefik
    restart: unless-stopped

networks:
  traefik:
    external: true
    name: traefik

volumes:
  pgdata_prod:
  miniodata_prod:
