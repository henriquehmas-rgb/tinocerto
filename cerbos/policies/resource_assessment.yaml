apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "assessment"
  version: "default"
  scope: ""
  rules:
    - name: "bloqueio-tenant-diferente"
      actions: ["*"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: >
            !(has(request.principal.attr.tenant_id) &&
              has(request.resource.attr.tenant_id) &&
              type(request.principal.attr.tenant_id) == string &&
              type(request.resource.attr.tenant_id) == string &&
              size(request.principal.attr.tenant_id) > 0 &&
              size(request.resource.attr.tenant_id) > 0 &&
              request.principal.attr.tenant_id == request.resource.attr.tenant_id)

    - name: "gestao-assessment"
      actions: ["create", "read", "start", "answer", "complete"]
      effect: EFFECT_ALLOW
      roles: ["admin_tenant", "recrutador", "gestor_vaga"]
