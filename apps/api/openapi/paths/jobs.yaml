root:
  get:
    operationId: listJobs
    summary: Lista as vagas do tenant (recrutador vê só as vagas atribuídas a ele).
    x-tinocerto-auth: session-only
    responses:
      '200':
        description: Lista de vagas.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '../components/schemas/hiring.yaml#/schemas/JobResumo' }
  post:
    operationId: createJob
    summary: Cria uma vaga a partir de uma requisição aprovada.
    x-tinocerto-auth: session-only
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/hiring.yaml#/schemas/JobCreateRequest' }
    responses:
      '201':
        description: Vaga criada (rascunho).
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/schemas/IdResponse' }

dashboardMetrics:
  get:
    operationId: getJobDashboardMetrics
    summary: Métricas agregadas do painel (vagas ativas/rascunho e candidaturas em andamento por etapa), filtradas por posse quando aplicável.
    x-tinocerto-auth: session-only
    responses:
      '200':
        description: Métricas agregadas.
        content:
          application/json:
            schema: { $ref: '../components/schemas/hiring.yaml#/schemas/DashboardMetricas' }

publish:
  post:
    operationId: publishJob
    summary: Publica a vaga nos canais informados.
    x-tinocerto-auth: session-only
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/hiring.yaml#/schemas/JobPublishRequest' }
    responses:
      '200':
        description: Vaga publicada.
        content:
          application/json:
            schema: { $ref: '../components/schemas/hiring.yaml#/schemas/JobPublishResponse' }

declararHabilidadesExigidas:
  post:
    operationId: declareJobRequiredSkills
    summary: Declara as habilidades exigidas da vaga (usado pelo score de aderência).
    x-tinocerto-auth: session-only
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/hiring.yaml#/schemas/JobDeclararHabilidadesRequest' }
    responses:
      '200':
        description: Habilidades atualizadas.
        content:
          application/json:
            schema: { $ref: '../components/schemas/hiring.yaml#/schemas/JobDeclararHabilidadesResponse' }

byId:
  patch:
    operationId: editJob
    summary: Edita título, descrição e/ou habilidades exigidas da vaga.
    x-tinocerto-auth: session-only
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/hiring.yaml#/schemas/EditarJobRequest' }
    responses:
      '200':
        description: Vaga atualizada.
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/schemas/IdResponse' }

funil:
  get:
    operationId: getJobFunil
    summary: Lista as candidaturas da vaga agrupadas por etapa do funil.
    x-tinocerto-auth: session-only
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Candidaturas agrupadas por etapa.
        content:
          application/json:
            schema: { $ref: '../components/schemas/hiring.yaml#/schemas/JobFunilResponse' }

atribuirRecrutadores:
  post:
    operationId: assignJobRecruiters
    summary: Atribui os recrutadores com acesso à vaga (substitui a lista de atribuições).
    x-tinocerto-auth: session-only
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/hiring.yaml#/schemas/AtribuirRecrutadoresRequest' }
    responses:
      '200':
        description: Recrutadores atribuídos.
        content:
          application/json:
            schema: { $ref: '../components/schemas/hiring.yaml#/schemas/AtribuirRecrutadoresResponse' }
